name: SOC Command Center CI
on:
  push:
    paths:
      - 'projects/soc-command-center/**'
      - '.github/workflows/soc-command-center-ci.yml'
  pull_request:
    paths:
      - 'projects/soc-command-center/**'
      - '.github/workflows/soc-command-center-ci.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/soc-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Frontend syntax
        run: node --check web/app.js
